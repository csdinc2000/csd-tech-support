# Fly.io app configuration — CSD RMM/CRM platform.
# Stays on 24/7 so Twilio webhooks (calls, SMS, voicemail) always answer.

app = 'workspace-ambered-brook-386'
primary_region = 'ewr'

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  # Keep the machine running 24/7 — Twilio cannot wake a stopped machine fast
  # enough to answer a ringing call.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
