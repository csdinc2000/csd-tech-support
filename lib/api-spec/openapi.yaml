openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: provider-health
    description: Sanitized provider monitoring operations
  - name: staff-access
    description: Owner-only staff access operations
paths:
  /aria/connections:
    get:
      operationId: getAriaConnections
      summary: Read private assistant connection configuration (not verified connectivity)
      responses:
        "200":
          description: Connection configuration with current administrator capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AriaConnections"
  /aria/connections/test:
    post:
      operationId: testAriaConnections
      summary: Authenticate to IMAP and SMTP without sending or changing messages
      responses:
        "200":
          description: Separate secure connection results
          content:
            application/json:
              schema:
                type: object
                required: [imap, smtp]
                properties:
                  imap:
                    $ref: "#/components/schemas/AriaConnectionTest"
                  smtp:
                    $ref: "#/components/schemas/AriaConnectionTest"
  /aria/actions:
    get:
      operationId: listAriaActions
      summary: List current user's outbound reviews for an owned conversation
      parameters:
        - in: query
          name: conversationId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Review history; listing never submits an action
          content:
            application/json:
              schema:
                type: object
                required: [actions]
                properties:
                  actions:
                    type: array
                    items:
                      $ref: "#/components/schemas/AriaOutboundAction"
  /aria/actions/{id}/confirm:
    post:
      operationId: confirmAriaAction
      summary: Explicitly submit an owned pending action once
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current action state; submitted is not proof of delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AriaActionResult"
  /aria/actions/{id}/cancel:
    post:
      operationId: cancelAriaAction
      summary: Cancel an owned pending action without sending
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Cancelled action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AriaActionResult"
  /crm/local-opportunities/discover:
    post:
      operationId: discoverLocalBusinessOpportunities
      summary: Find nearby OpenStreetMap businesses with public websites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalBusinessDiscoveryInput"
      responses:
        "200":
          description: Nearby businesses with public websites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalBusinessDiscoveryResult"
        "400":
          description: Invalid search radius
        "502":
          description: The public business directory could not be reached
  /crm/local-opportunities/audit:
    post:
      operationId: auditLocalBusinessWebsite
      summary: Check a public business website with WhatCMS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalBusinessAuditInput"
      responses:
        "200":
          description: Website technology results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalBusinessAuditResult"
        "400":
          description: Invalid public website URL
        "429":
          description: The WhatCMS account or local request limit was reached
        "502":
          description: WhatCMS could not complete the check
        "503":
          description: WhatCMS API key is not configured
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /staff-access/{userId}/profile:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getStaffContactProfile
      summary: Read staff contact details and verified sign-in email choices
      responses:
        "200":
          description: Administrator-only staff profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffContactProfile" }
    patch:
      operationId: updateStaffContactProfile
      summary: Edit staff contact details and select an already verified sign-in email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffContactUpdate" }
      responses:
        "200":
          description: Profile saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffContactSaveResult" }
        "409":
          description: Record changed or email identity could not be safely updated
  /staff-access/accounts:
    get:
      operationId: listStaffAccessAccounts
      tags: [staff-access]
      summary: Discover Clerk accounts for staff access
      description: Read-only owner-only lookup of Clerk accounts with strictly identity-linked staff status and display-only invitation status.
      parameters:
        - name: q
          in: query
          required: false
          description: Trimmed Clerk account search query, limited to 100 characters.
          schema:
            type: string
            maxLength: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: clerkUserId
          in: query
          required: false
          description: Select one exact Clerk user instead of relying on search text or pagination.
          schema:
            type: string
            maxLength: 100
            pattern: '^user_[A-Za-z0-9]+$'
      responses:
        "200":
          description: Clerk account discovery page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAccessAccountPage"
        "400":
          description: Invalid search query or offset
        "403":
          description: Owner access required
        "500":
          description: Could not load staff account details
        "503":
          description: Clerk account discovery is temporarily unavailable
  /provider-health/email:
    get:
      operationId: getEmailProviderHealth
      tags: [provider-health]
      summary: Get sanitized email provider health
      responses:
        "200":
          description: Sanitized email provider health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailProviderHealth"
  /provider-health/email/warning-settings:
    patch:
      operationId: updateEmailProviderWarningSettings
      tags: [provider-health]
      summary: Update the email provider warning threshold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailProviderWarningSettings"
      responses:
        "200":
          description: Updated email provider warning settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailProviderWarningSettings"
  /provider-health/email/warning-settings/history:
    get:
      operationId: getEmailProviderWarningSettingsHistory
      tags: [provider-health]
      summary: Get email provider warning threshold history
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: fromDate
          in: query
          required: false
          description: Inclusive UTC instant for the start of the owner's selected local date.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}T'
        - name: toDate
          in: query
          required: false
          description: Exclusive UTC instant after the owner's selected local end date.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}T'
      responses:
        "200":
          description: Email provider warning settings audit history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailProviderWarningSettingsHistoryPage"
  /provider-health/email/warning-settings/history/export:
    get:
      operationId: exportEmailProviderWarningSettingsHistory
      tags: [provider-health]
      summary: Export owner-only email warning threshold changes as CSV
      parameters:
        - name: fromDate
          in: query
          required: false
          description: Inclusive UTC instant for the start of the owner's selected local date.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}T'
        - name: toDate
          in: query
          required: false
          description: Exclusive UTC instant after the owner's selected local end date.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}T'
      responses:
        "200":
          description: CSV of warning changes, newest first
          content:
            text/csv:
              schema:
                type: string
  /provider-health/email/recheck:
    post:
      operationId: recheckEmailProviderHealth
      tags: [provider-health]
      summary: Recheck sanitized email provider capacity
      responses:
        "200":
          description: Sanitized email provider capacity status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailProviderCapacityStatus"
  /provider-health/slack:
    get:
      operationId: getSlackDeliveryHealth
      tags: [provider-health]
      summary: Get sanitized Slack notification health
      responses:
        "200":
          description: Sanitized Slack notification health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlackDeliveryHealth"
  /provider-health/slack/failures:
    get:
      operationId: listSlackTerminalFailures
      tags: [provider-health]
      summary: List sanitized terminal Slack failures for owners
      responses:
        "200":
          description: Most recent terminal failures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SlackTerminalFailure"
  /provider-health/slack/failures/{id}/retry:
    post:
      operationId: retrySlackTerminalFailure
      tags: [provider-health]
      summary: Queue one sanitized recovery notice for a terminal failure
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Existing or newly queued retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlackRetryResult"
        "404":
          description: Terminal failure not found
  /intake/{id}/email-history:
    get:
      operationId: getIntakeEmailHistory
      summary: List privacy-conscious service-request email submission attempts for staff
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Submission history; acceptance is not confirmation of customer delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeEmailHistory"
        "404":
          description: Service request not found
  /intake/{id}/email:
    post:
      operationId: sendIntakeEmail
      summary: Send a staff-written email to the saved service-request customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeEmailMessage"
      responses:
        "200":
          description: Accepted by the configured email provider
          content:
            application/json:
              schema:
                type: object
                properties:
                  submitted: { type: boolean }
                required: [submitted]
        "400":
          description: Invalid message or missing customer address
        "404":
          description: Service request not found
        "409":
          description: Saved customer email changed while composing
        "502":
          description: Submission rejected or outcome uncertain; check history before retrying
  /calendar/meeting-staff:
    get:
      operationId: listMeetingStaff
      summary: List approved staff who can receive internal meeting invitations
      responses:
        "200":
          description: Minimal active staff directory for meeting invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingStaffList"
  /communications/recipients:
    get:
      operationId: searchCommunicationRecipients
      summary: Search visible CRM contacts and approved staff for communications
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
      responses:
        "200":
          description: Authorized recipients matching the search
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationRecipientList"
  /communications/email:
    post:
      operationId: sendCommunicationEmail
      summary: Send one support-branded email to selected recipients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunicationEmailInput"
      responses:
        "201":
          description: Email provider accepted the submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationEmailSubmission"
        "400":
          description: Invalid message or recipient selection
        "409":
          description: Duplicate or unresolved earlier submission
        "429":
          description: Per-user sending limit reached
        "502":
          description: Provider rejected the email or its delivery outcome is uncertain
  /calendar/meetings:
    post:
      operationId: createStaffMeeting
      summary: Create a Google Calendar invitation with a Google Meet or Zoom link and invite staff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffMeetingInput"
      responses:
        "201":
          description: Calendar event created and Slack notification queued when configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMeetingResult"
        "400":
          description: Invalid meeting details or staff selection
        "409":
          description: Calendar is not attached or the selected staff list changed
        "502":
          description: Google Calendar could not create the meeting
  /staff-calendar/events:
    get:
      operationId: getStaffCalendarEvents
      summary: Read shared calendar events or assignment-scoped technician appointments
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Events visible to the current staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffCalendarResult"
        "400":
          description: Invalid date range
        "403":
          description: Calendar access denied
    post:
      operationId: createStaffCalendarEvent
      summary: Add an event to the shared booking calendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffCalendarEventInput"
      responses:
        "201":
          description: Event created
        "400":
          description: Invalid event details
        "403":
          description: Scheduling access required
        "502":
          description: Google Calendar could not create the event
  /staff-calendar/events/{eventId}:
    patch:
      operationId: updateStaffCalendarEvent
      summary: Update an event on the shared booking calendar
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffCalendarEventInput"
      responses:
        "200":
          description: Event updated
        "400":
          description: Invalid event changes
        "403":
          description: Scheduling access required
        "409":
          description: Appointment time conflicts with another booking
        "502":
          description: Google Calendar could not update the event
    delete:
      operationId: deleteStaffCalendarEvent
      summary: Remove an event and cancel a linked customer appointment
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Event deleted
        "403":
          description: Scheduling access required
        "502":
          description: Google Calendar could not delete the event
components:
  schemas:
    StaffCalendarEvent:
      type: object
      required: [id, summary, startIso, endIso, kind, editable]
      properties:
        id: { type: string }
        summary: { type: string }
        description: { type: [string, "null"] }
        location: { type: [string, "null"] }
        startIso: { type: [string, "null"] }
        endIso: { type: [string, "null"] }
        htmlLink: { type: [string, "null"], format: uri }
        status: { type: string }
        reference: { type: [string, "null"] }
        kind: { type: string, enum: [event, appointment] }
        appointmentId: { type: [integer, "null"] }
        customerName: { type: [string, "null"] }
        serviceName: { type: [string, "null"] }
        appointmentStatus: { type: [string, "null"] }
        editable: { type: boolean }
    StaffCalendarResult:
      type: object
      required: [events, canManage, configured, source]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/StaffCalendarEvent" }
        canManage: { type: boolean }
        configured: { type: boolean }
        source: { type: string }
    StaffCalendarEventInput:
      type: object
      properties:
        summary: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        location: { type: string, maxLength: 500 }
        startIso: { type: string, format: date-time }
        endIso: { type: string, format: date-time }
        timezone: { type: string, minLength: 1, maxLength: 100 }
        attendees:
          type: array
          maxItems: 100
          items:
            type: object
            required: [email]
            properties:
              email: { type: string, format: email }
              displayName: { type: string, maxLength: 200 }
    MeetingStaff:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
    MeetingStaffList:
      type: object
      required: [staff]
      properties:
        staff:
          type: array
          items:
            $ref: "#/components/schemas/MeetingStaff"
    StaffMeetingInput:
      type: object
      required: [summary, startIso, endIso, timezone, inviteAllStaff, staffIds]
      properties:
        summary: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        startIso: { type: string, format: date-time }
        endIso: { type: string, format: date-time }
        timezone: { type: string, minLength: 1, maxLength: 100 }
        provider: { type: string, enum: [google_meet, zoom], default: google_meet }
        inviteAllStaff: { type: boolean }
        staffIds:
          type: array
          items: { type: string, minLength: 1, maxLength: 200 }
        guestEmails:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/MeetingGuest"
    MeetingGuest:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 254 }
    StaffMeetingResult:
      type: object
      required: [eventId, eventUrl, provider, meetUrl, zoomUrl, staffInvited, guestInvited, slackQueued]
      properties:
        eventId: { type: string }
        eventUrl: { type: ["string", "null"], format: uri }
        provider: { type: string, enum: [google_meet, zoom] }
        meetUrl: { type: ["string", "null"], format: uri }
        zoomUrl: { type: ["string", "null"], format: uri }
        staffInvited: { type: integer, minimum: 0 }
        guestInvited: { type: integer, minimum: 0 }
        slackQueued: { type: boolean }
    LocalBusinessDiscoveryInput:
      type: object
      additionalProperties: false
      required: [radiusMiles]
      properties:
        radiusMiles: { type: integer, minimum: 1, maximum: 25 }
    LocalBusinessOpportunity:
      type: object
      additionalProperties: false
      required: [id, name, website, category, elementType, osmUrl]
      properties:
        id: { type: string }
        name: { type: string }
        website: { type: string, format: uri }
        category: { type: string }
        elementType: { type: string, enum: [node, way, relation] }
        osmUrl: { type: string, format: uri }
    LocalBusinessDiscoveryResult:
      type: object
      additionalProperties: false
      required: [businesses, total, radiusMiles, center, whatCmsConfigured]
      properties:
        businesses:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/LocalBusinessOpportunity" }
        total: { type: integer, minimum: 0 }
        radiusMiles: { type: integer, minimum: 1, maximum: 25 }
        center: { type: string }
        whatCmsConfigured: { type: boolean }
    LocalBusinessAuditInput:
      type: object
      additionalProperties: false
      required: [website]
      properties:
        website: { type: string, format: uri, maxLength: 2048 }
    LocalBusinessAuditResult:
      type: object
      additionalProperties: false
      required: [status, cms, language, technologies, isWordPressOpportunity, message]
      properties:
        status: { type: string, enum: [success, not_detected, unavailable, rate_limited] }
        cms: { type: ["string", "null"] }
        language: { type: ["string", "null"] }
        technologies:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 100 }
        isWordPressOpportunity: { type: boolean }
        message: { type: ["string", "null"], maxLength: 300 }
    CommunicationRecipient:
      type: object
      additionalProperties: false
      required: [id, name, email, kind]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 200 }
        email: { type: string, format: email }
        kind: { type: string, enum: [staff, customer] }
        company: { type: [string, "null"], maxLength: 200 }
    CommunicationRecipientList:
      type: object
      additionalProperties: false
      required: [recipients]
      properties:
        recipients:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/CommunicationRecipient"
    CommunicationEmailInput:
      type: object
      additionalProperties: false
      required: [requestId, recipients, subject, body]
      properties:
        requestId: { type: string, format: uuid }
        recipients:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: email, maxLength: 254 }
        subject: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 10000 }
    CommunicationEmailSubmission:
      type: object
      additionalProperties: false
      required: [status, recipientCount]
      properties:
        status: { type: string, enum: [accepted, rejected, unknown] }
        recipientCount: { type: integer, minimum: 1, maximum: 20 }
        message: { type: string, maxLength: 400 }
    AriaConnections:
      type: object
      required: [mailbox, twilio, canUseMailbox]
      properties:
        mailbox:
          type: object
          required: [configured, host, user]
          properties:
            configured:
              type: boolean
            host:
              type: [string, "null"]
            user:
              type: [string, "null"]
        twilio:
          type: object
          required: [configured]
          properties:
            configured:
              type: boolean
        canUseMailbox:
          type: boolean
    AriaConnectionTest:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        error:
          type: string
    AriaOutboundAction:
      type: object
      required: [id, kind, to, subject, body, status, expiresAt, result]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [email, sms, call]
        to:
          type: string
        subject:
          type: [string, "null"]
        body:
          type: string
        status:
          type: string
          enum: [pending, sending, submitted, uncertain, cancelled]
        expiresAt:
          type: string
          format: date-time
        result:
          type: [string, "null"]
    AriaActionResult:
      type: object
      required: [action]
      properties:
        action:
          $ref: "#/components/schemas/AriaOutboundAction"
    StaffContactProfile:
      type: object
      required: [email, phone, jobTitle, department, updatedAt, verifiedEmails, emailChangeAvailable, emailMessage]
      properties:
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        jobTitle: { type: [string, "null"] }
        department: { type: [string, "null"] }
        updatedAt: { type: [string, "null"] }
        verifiedEmails:
          type: array
          items: { type: string }
        emailChangeAvailable: { type: boolean }
        emailMessage: { type: string }
    StaffContactUpdate:
      type: object
      additionalProperties: false
      required: [phone, jobTitle, department, expectedEmail, expectedUpdatedAt]
      properties:
        phone: { type: string, maxLength: 64 }
        jobTitle: { type: string, maxLength: 100 }
        department: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 320 }
        expectedEmail: { type: [string, "null"] }
        expectedUpdatedAt: { type: [string, "null"] }
    StaffContactSaveResult:
      type: object
      required: [saved]
      properties:
        saved: { type: boolean }
    StaffAccessAccount:
      type: object
      additionalProperties: false
      properties:
        clerkUserId: { type: string }
        email: { type: [string, "null"] }
